<footer class="modulex-bnt{{bntsinif}}" role="contentinfo">
  <div class="modulex-bnt-izgara">
    <section class="modulex-bnt-karo modulex-bnt-marka">
      <a class="modulex-bnt-logo" href="/{{lang}}/" aria-label="@home@ - {{web-name}}">
        <img src="/img/{{logo}}" alt="{{web-name}}" loading="lazy" decoding="async" />
      </a>
      {{bnthakkinda}}
      {{bntcta}}
    </section>
    <nav class="modulex-bnt-karo modulex-bnt-sayfa" aria-label="@navigation@">
      <h2 class="modulex-bnt-baslik">@pages@</h2>
      <ul class="modulex-bnt-liste modulex-bnt-liste--sayfa">{{bntsayfa}}</ul>
    </nav>
    {{bntiletisim}}
    {{bntsosyal}}
    <div class="modulex-bnt-karo modulex-bnt-telif">
      <p>&copy; {{bntyil}} {{web-name}}</p>
      <p class="modulex-bnt-hak">@all-rights@</p>
    </div>
    <div class="modulex-bnt-karo modulex-bnt-dil">{{langbar}}</div>
    <a class="modulex-bnt-karo modulex-bnt-yukari" href="#" aria-label="@back-to-top@">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_upward</span>
    </a>
  </div>
</footer>

<style>
  /* footer-bento — karo ızgara (15 Kas 2026, G3). Her bilgi bloğu ayrı yuvarlak karo; marka karosu büyük (2×2), «başa dön» karosu
     vurgu renkli kare. Eksik karo ızgarayı boş bırakmaz (sınıflar alanları yeniden dağıtır). Renkler yalnız desing anahtarından
     (var(--mx-site-*) varsayılanlı) — koyu mod otomatik; mantıksal CSS → RTL'de ızgara aynalanır. */
  .modulex-bnt {
    box-sizing: border-box;
    width: 100%;
    padding: 28px 16px 20px;
    background: --bg--;
    color: --text--;
    font-family: var(--mx-font-sans, inherit);
  }
  .modulex-bnt *,
  .modulex-bnt *::before,
  .modulex-bnt *::after { box-sizing: border-box; }
  .modulex-bnt-izgara {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas:
      "marka sayfa iletisim iletisim"
      "marka sayfa sosyal sosyal"
      "telif telif dil yukari";
    gap: 12px;
    max-width: --max--;
    margin-inline: auto;
  }
  .modulex-bnt--sosyalsiz .modulex-bnt-izgara {
    grid-template-areas:
      "marka sayfa iletisim iletisim"
      "marka sayfa iletisim iletisim"
      "telif telif dil yukari";
  }
  .modulex-bnt--iletisimsiz .modulex-bnt-izgara {
    grid-template-areas:
      "marka sayfa sosyal sosyal"
      "marka sayfa sosyal sosyal"
      "telif telif dil yukari";
  }
  .modulex-bnt--iletisimsiz.modulex-bnt--sosyalsiz .modulex-bnt-izgara {
    grid-template-areas:
      "marka sayfa sayfa sayfa"
      "marka sayfa sayfa sayfa"
      "telif telif dil yukari";
  }
  .modulex-bnt-karo {
    min-width: 0;
    padding: 22px;
    border-radius: --yuvarlak--;
    background: --karo--;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .modulex-bnt-marka { grid-area: marka; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; padding: 28px; }
  .modulex-bnt-sayfa { grid-area: sayfa; }
  .modulex-bnt-iletisim { grid-area: iletisim; }
  .modulex-bnt-sosyal-karo { grid-area: sosyal; }
  .modulex-bnt-telif { grid-area: telif; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; }
  .modulex-bnt-dil { grid-area: dil; display: flex; align-items: center; justify-content: center; }
  .modulex-bnt-telif p { margin: 0; font-size: 0.85rem; }
  .modulex-bnt-hak { color: --muted--; }

  .modulex-bnt-logo { display: inline-flex; align-items: center; min-height: 44px; }
  .modulex-bnt-logo img {
    display: block;
    height: auto;
    width: auto;
    max-height: --logo_h--;
    max-width: 210px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .modulex-bnt-logo img[src*=".svg"] { height: --logo_h--; width: auto; max-width: none; }
  .modulex-bnt-hakkinda { margin: 0; max-width: 36ch; color: --muted--; font-size: 1.05rem; line-height: 1.6; }
  .modulex-bnt .modulex-bnt-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    margin-block-start: auto;
    padding-inline: 20px;
    border-radius: 999px;
    background: --accent--;
    color: --accentText-- !important;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: gap 0.25s ease, filter 0.25s ease;
  }
  .modulex-bnt .modulex-bnt-cta:hover { gap: 14px; filter: brightness(1.06); }
  .modulex-bnt .modulex-bnt-cta:focus-visible { outline: 2px solid --text--; outline-offset: 3px; }

  .modulex-bnt-baslik {
    margin: 0 0 10px;
    color: --muted--;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .modulex-bnt-liste { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
  .modulex-bnt-liste li { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .modulex-bnt-liste .material-symbols-outlined { flex-shrink: 0; font-size: 20px; color: --accent--; }
  .modulex-bnt-adres { padding-block: 10px; line-height: 1.5; }
  .modulex-bnt .modulex-bnt-link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: --text--;
    text-decoration: none;
    overflow-wrap: anywhere;
    cursor: pointer;
    background-image: linear-gradient(currentColor, currentColor);
    background-repeat: no-repeat;
    background-position: 0 85%;
    background-size: 0 1px;
    transition: background-size 0.3s ease, color 0.25s ease;
  }
  [dir="rtl"] .modulex-bnt .modulex-bnt-link { background-position: 100% 85%; }
  .modulex-bnt .modulex-bnt-link:hover,
  .modulex-bnt .modulex-bnt-link:focus-visible { background-size: 100% 1px; }
  .modulex-bnt .modulex-bnt-link[aria-current="page"] { color: --accent--; }
  .modulex-bnt .modulex-bnt-link:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

  .modulex-bnt-sosyal { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .modulex-bnt .modulex-bnt-sosyal-a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: --bg--;
    color: --text--;
    font-size: 20px;
    cursor: pointer;
    transition: transform 0.25s ease, background-color 0.25s ease, color 0.25s ease;
  }
  .modulex-bnt .modulex-bnt-sosyal-a:hover,
  .modulex-bnt .modulex-bnt-sosyal-a:focus-visible { transform: translateY(-3px); background: --accent--; color: --accentText--; }

  .modulex-bnt .modulex-bnt-yukari {
    grid-area: yukari;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 64px;
    background: --accent--;
    color: --accentText-- !important;
    font-size: 28px;
    text-decoration: none;
    cursor: pointer;
  }
  .modulex-bnt .modulex-bnt-yukari .material-symbols-outlined { font-size: 28px; transition: transform 0.3s ease; }
  .modulex-bnt .modulex-bnt-yukari:hover .material-symbols-outlined { transform: translateY(-5px); }
  .modulex-bnt .modulex-bnt-yukari:focus-visible { outline: 2px solid --text--; outline-offset: 3px; }

  @media (hover: hover) {
    .modulex-bnt-marka:hover,
    .modulex-bnt-sayfa:hover { box-shadow: 0 16px 32px -24px color-mix(in srgb, --text-- 60%, transparent); }
  }
  @media (max-width: 1024px) {
    .modulex-bnt-izgara,
    .modulex-bnt--sosyalsiz .modulex-bnt-izgara,
    .modulex-bnt--iletisimsiz .modulex-bnt-izgara,
    .modulex-bnt--iletisimsiz.modulex-bnt--sosyalsiz .modulex-bnt-izgara {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas:
        "marka marka"
        "sayfa iletisim"
        "sayfa sosyal"
        "telif telif"
        "dil yukari";
    }
    .modulex-bnt--sosyalsiz .modulex-bnt-izgara { grid-template-areas: "marka marka" "sayfa iletisim" "telif telif" "dil yukari"; }
    .modulex-bnt--iletisimsiz .modulex-bnt-izgara { grid-template-areas: "marka marka" "sayfa sosyal" "telif telif" "dil yukari"; }
    .modulex-bnt--iletisimsiz.modulex-bnt--sosyalsiz .modulex-bnt-izgara { grid-template-areas: "marka marka" "sayfa sayfa" "telif telif" "dil yukari"; }
  }
  @media (max-width: 768px) {
    .modulex-bnt { padding-inline: 12px; }
    .modulex-bnt-izgara,
    .modulex-bnt--sosyalsiz .modulex-bnt-izgara,
    .modulex-bnt--iletisimsiz .modulex-bnt-izgara,
    .modulex-bnt--iletisimsiz.modulex-bnt--sosyalsiz .modulex-bnt-izgara {
      grid-template-columns: minmax(0, 1fr) 80px;
      grid-template-areas: "marka marka" "sayfa sayfa" "iletisim iletisim" "sosyal sosyal" "telif telif" "dil yukari";
      gap: 10px;
    }
    .modulex-bnt-liste--sayfa { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 12px; }
    .modulex-bnt-karo { padding: 18px; }
    .modulex-bnt-dil { justify-content: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-bnt * { transition: none !important; animation: none !important; }
  }
</style>

<script>
  (() => {
    const kok = document.querySelector(".modulex-bnt");
    if (!kok || kok.dataset.bntHazir) return;
    kok.dataset.bntHazir = "1";
    kok.querySelector(".modulex-bnt-yukari")?.addEventListener("click", (e) => {
      e.preventDefault();
      const azHareket = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.scrollTo({ top: 0, behavior: azHareket ? "auto" : "smooth" });
      document.querySelector("header a[href], a[href]")?.focus({ preventScroll: true });
    });
  })();
</script>
