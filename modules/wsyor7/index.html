<section class="modulex-iletisim-telefon-odak{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-iletisim-telefon-odak-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* iletisim-telefon-odak — Tek eylem odaklı: «hemen arayın» isteyen acil servis, çekici, tesisatçı gibi işletmeler için dönüşüm odaklı blok. */
  .modulex-iletisim-telefon-odak { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-iletisim-telefon-odak *, .modulex-iletisim-telefon-odak *::before, .modulex-iletisim-telefon-odak *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-iletisim-telefon-odak :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-iletisim-telefon-odak :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-iletisim-telefon-odak :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-iletisim-telefon-odak :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-iletisim-telefon-odak img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-iletisim-telefon-odak) img { height: auto; }
  .modulex-iletisim-telefon-odak [hidden] { display: none !important; }
  .modulex-iletisim-telefon-odak :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-iletisim-telefon-odak :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-iletisim-telefon-odak-ic { max-width: --max--; margin-inline: auto; }
  .modulex-iletisim-telefon-odak-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-iletisim-telefon-odak--bassiz .modulex-iletisim-telefon-odak-bas { display: none; }
  .modulex-iletisim-telefon-odak-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-iletisim-telefon-odak-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-iletisim-telefon-odak-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-iletisim-telefon-odak-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-iletisim-telefon-odak-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-iletisim-telefon-odak-dugme:hover { transform: translateY(-2px); }
  .modulex-iletisim-telefon-odak-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-iletisim-telefon-odak-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-iletisim-telefon-odak-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-iletisim-telefon-odak-merkez { display: grid; justify-items: center; gap: 14px; max-width: 900px; margin-inline: auto; text-align: center; }
  .modulex-iletisim-telefon-odak-dev { display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 16px; margin-block: 10px 4px; color: inherit; font-family: var(--mx-font-heading, inherit); font-size: clamp(1.9rem, 7vw, 4.6rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-telefon-odak-dev:hover { color: --accentInk--; }
  .modulex-iletisim-telefon-odak-devik { color: --accentInk--; font-size: 1em; animation: modulex-iletisim-telefon-odak-cal 2.6s ease-in-out infinite; }
  @keyframes modulex-iletisim-telefon-odak-cal { 0%, 82%, 100% { transform: rotate(0); } 86% { transform: rotate(-14deg); } 92% { transform: rotate(12deg); } }
  .modulex-iletisim-telefon-odak-devy { min-width: 0; }
  .modulex-iletisim-telefon-odak-eylemler { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; }
  .modulex-iletisim-telefon-odak-eylemler:empty { display: none; }
  .modulex-iletisim-telefon-odak-kopya { color: inherit; }
  .modulex-iletisim-telefon-odak-ikincil { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 28px; margin-block-start: 22px; padding-block-start: 22px; border-block-start: 1px solid --cizgi--; width: 100%; }
  .modulex-iletisim-telefon-odak-ik { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
  .modulex-iletisim-telefon-odak-iik { color: --accentInk--; font-size: 20px; }
  .modulex-iletisim-telefon-odak-ik .modulex-iletisim-telefon-odak-deger { font-weight: 600; }
  .modulex-iletisim-telefon-odak-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-telefon-odak-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-telefon-odak-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-telefon-odak-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-telefon-odak-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-telefon-odak-eylem:hover { gap: 10px; }
  .modulex-iletisim-telefon-odak-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-telefon-odak-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-telefon-odak--kjs .modulex-iletisim-telefon-odak-kopya { display: inline-flex; }
  .modulex-iletisim-telefon-odak-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-telefon-odak-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-telefon-odak--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-telefon-odak-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-telefon-odak-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-telefon-odak-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-telefon-odak-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-telefon-odak-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-telefon-odak-cikon { font-size: 18px; }
  .modulex-iletisim-telefon-odak-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-telefon-odak-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-telefon-odak-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-telefon-odak-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-telefon-odak-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-telefon-odak-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-telefon-odak-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }
  .modulex-iletisim-telefon-odak-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-telefon-odak-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-telefon-odak :is(.modulex-iletisim-telefon-odak-baslik, .modulex-iletisim-telefon-odak-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-telefon-odak-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-iletisim-telefon-odak { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-telefon-odak *, .modulex-iletisim-telefon-odak *::before, .modulex-iletisim-telefon-odak *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-telefon-odak";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const kopyala = (s, P) => {
        if (!navigator.clipboard || !navigator.clipboard.writeText) return;
        s.classList.add(P + "--kjs");
        s.querySelectorAll("[data-kopyala]").forEach((b) => {
          const yazi = b.querySelector("." + P + "-kyazi");
          const ilk = yazi ? yazi.textContent : "";
          b.addEventListener("click", () => {
            const bitti = () => {
              b.classList.add(P + "--kopyalandi");
              if (yazi) yazi.textContent = b.dataset.tamam || ilk;
              setTimeout(() => { b.classList.remove(P + "--kopyalandi"); if (yazi) yazi.textContent = ilk; }, 2000);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b.dataset.kopyala).then(bitti, () => {});
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      kopyala(s, P, az);
    });
  })();
</script>
